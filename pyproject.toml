[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdownloader-gui"
version = "0.1.4"
description = "안전한 yt-dlp 기반 Windows GUI 다운로더"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
]

[project.urls]
Homepage = "https://github.com/AIJeongwon/YTDownloader"
Repository = "https://github.com/AIJeongwon/YTDownloader"
Issues = "https://github.com/AIJeongwon/YTDownloader/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.gui-scripts]
ytdownloader = "ytdownloader.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
