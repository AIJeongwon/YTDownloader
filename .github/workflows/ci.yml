name: 지속적 통합

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: 소스 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Python 준비
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.15"
          cache: pip

      - name: 테스트 의존성 설치
        shell: pwsh
        run: python -m pip install -c constraints.txt -r deployment/requirements.txt -e .

      - name: 단위 테스트
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: 소스 구문 검사
        shell: pwsh
        run: python -m compileall -q src deployment tests

      - name: 배포 셸 구문 검사
        shell: bash
        run: bash -n deployment/package_ffmpeg_sources.sh
