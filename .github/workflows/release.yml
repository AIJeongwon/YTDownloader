name: Windows 릴리스

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ffmpeg-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: 소스 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Python 준비
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.15"

      - name: 검증된 FFmpeg-Builds 소스 준비
        run: |
          python deployment/prepare_assets.py sources \
            --manifest deployment/assets.json \
            --cache build/bootstrap \
            --output build/source-assets \
            --python-version 3.13.15

      - name: FFmpeg 의존 대응 소스 생성
        shell: bash
        run: |
          bash deployment/package_ffmpeg_sources.sh \
            build/source-assets/ffmpeg-builds-ea2ec3c0-source.tar.gz \
            build/ffmpeg-dependencies-ea2ec3c0-source.tar
          size=$(stat -c '%s' build/ffmpeg-dependencies-ea2ec3c0-source.tar)
          if (( size > 1900000000 )); then
            echo "생성된 대응 소스가 GitHub 자산 제한을 초과합니다: $size" >&2
            exit 1
          fi

      - name: FFmpeg 의존 대응 소스 전달
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ffmpeg-dependency-sources
          path: build/ffmpeg-dependencies-ea2ec3c0-source.tar
          if-no-files-found: error
          compression-level: 0

  windows-build:
    needs: ffmpeg-sources
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: 소스 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Python 준비
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.15"
          cache: pip

      - name: 빌드 의존성 설치
        shell: pwsh
        run: |
          python -m pip install -c constraints.txt -r deployment/requirements.txt -e .

      - name: 태그와 앱 버전 확인
        shell: pwsh
        run: |
          $version = (python deployment/release_metadata.py version).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "태그 ${{ github.ref_name }}와 앱 버전 $version이 일치하지 않습니다."
          }

      - name: 설치 파일 빌드
        shell: pwsh
        run: |
          ./deployment/build.ps1 -PythonCommand python -RepositoryUrl "https://github.com/${{ github.repository }}" -Publisher "${{ github.repository_owner }}"

      - name: 대응 소스 준비
        shell: pwsh
        run: |
          $env:PYTHONIOENCODING = "utf-8"
          python deployment/prepare_assets.py sources `
            --manifest deployment/assets.json `
            --cache build/bootstrap `
            --output dist/sources `
            --python-version 3.13.15

      - name: FFmpeg 의존 대응 소스 받기
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ffmpeg-dependency-sources
          path: dist/sources

      - name: 설치·실행·제거 검사
        shell: pwsh
        run: |
          ./deployment/test_installer.ps1 `
            -Installer dist/YTDownloader-Setup.exe `
            -InstallDirectory "${{ runner.temp }}/YTDownloader-install-test"

      - name: 릴리스 체크섬 생성
        shell: pwsh
        run: |
          $files = @("dist/YTDownloader-Setup.exe")
          $files += Get-ChildItem -LiteralPath "dist/sources" -File | ForEach-Object { $_.FullName }
          python deployment/checksums.py --output dist/SHA256SUMS.txt $files

      - name: 릴리스 체크섬 검증
        shell: pwsh
        run: python deployment/checksums.py --verify dist/SHA256SUMS.txt --search-root dist

      - name: 빌드 출처 증명 생성
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: 릴리스 자산 전달
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets
          path: |
            dist/YTDownloader-Setup.exe
            dist/SHA256SUMS.txt
            dist/sources/*
          if-no-files-found: error
          compression-level: 0

  github-release:
    needs: windows-build
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: 소스 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Python 준비
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.15"

      - name: 릴리스 자산 받기
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets
          path: dist

      - name: 게시 전 체크섬 재검증
        shell: pwsh
        run: python deployment/checksums.py --verify dist/SHA256SUMS.txt --search-root dist

      - name: GitHub Release 게시
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @("dist/YTDownloader-Setup.exe", "dist/SHA256SUMS.txt")
          $assets += Get-ChildItem -LiteralPath "dist" -File -Recurse |
            Where-Object { $_.Name -notin @("YTDownloader-Setup.exe", "SHA256SUMS.txt") } |
            ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" $assets `
            --repo "${{ github.repository }}" `
            --title "YTDownloader ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
