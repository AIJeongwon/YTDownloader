name: 버그 신고
description: 재현 가능한 YTDownloader 문제를 알려 주세요.
title: "[버그] "
body:
  - type: markdown
    attributes:
      value: |
        신고해 주셔서 감사합니다. 보안 취약점은 이 양식 대신 비공개 취약점 신고를 이용해 주세요.
        쿠키, 로그인 토큰, 개인 영상 주소와 개인정보는 반드시 제거해 주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 사전 확인
      options:
        - label: 최신 정식 릴리스에서도 문제가 발생합니다.
          required: true
        - label: 공개 이슈에 올려도 되는 일반 버그이며 보안 취약점이 아닙니다.
          required: true

  - type: input
    id: app-version
    attributes:
      label: YTDownloader 버전
      description: 앱의 버전 번호를 입력해 주세요.
      placeholder: 예: 0.1.4
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows 버전
      placeholder: 예: Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 단계
      description: 문제를 반복해서 확인할 수 있도록 순서대로 적어 주세요.
      placeholder: |
        1. 앱을 실행합니다.
        2. ...
        3. 문제가 발생합니다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상 동작
      description: 정상이라면 어떻게 동작해야 하는지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제 결과와 표시된 오류 메시지를 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: 추가 정보
      description: 민감정보를 제거한 로그, 화면 자료나 관련 정보를 첨부해 주세요.
